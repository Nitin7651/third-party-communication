spring.application.name=third-party-communication
# --- Spring Server ---
server.port=8080

# --- PostgreSQL Database Connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/whatsapp_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# Automatically creates/updates the table schema based on your @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.third.party.communication=DEBUG